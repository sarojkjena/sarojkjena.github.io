<style>
/* Layout: one-column phone app (max 520px) over a sky backdrop; screens swap above a fixed bottom tab bar */
:root{
  --sky1:#bfe6ff; --sky2:#fff3d6; --card:#ffffff; --ink:#1f2a4d; --muted:#6a7396; --line:#e3e8f6; --soft:#f3f6ff;
  --blue:#2f8cff; --teal:#18c4c4; --pink:#ff5d8f; --orange:#ff9a1f; --yellow:#ffc928; --green:#2fc46b; --purple:#8f5bff; --red:#ff4d5a;
  --shadow:0 6px 0 rgba(31,42,77,.08),0 10px 24px rgba(31,42,77,.10); --ocean:#aee0ff; --land:#a5e08f; --landline:#72bd5d; color-scheme:light;
  --display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif; --body:"Nunito",ui-rounded,system-ui,sans-serif;
}
html,body{height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:linear-gradient(var(--sky1),var(--sky2)) fixed var(--sky1);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px}
main{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
h1{font-size:2rem;font-weight:800}h2{font-size:1.45rem;font-weight:800}h3{font-size:1.15rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.press{transition:transform .15s}.press:active{transform:scale(.96)}
.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:12px}
.top .grow{flex:1;min-width:0}
.back{border:0;background:var(--card);box-shadow:var(--shadow);width:44px;height:44px;border-radius:50%;font-size:22px;display:grid;place-items:center;flex:none}
.hello{display:flex;align-items:center;gap:12px;padding:16px}
.bubble{position:relative;background:var(--card);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);font-size:.98rem;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--card);border-left:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;align-items:stretch}
.pill{border-radius:16px;padding:8px 4px;display:grid;justify-items:center;gap:0;background:var(--card);box-shadow:var(--shadow)}
.pill b{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.1}
.pill span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:16px;width:46px;font-size:20px}
.soundbtn{height:46px;margin-left:auto;flex:none}
.iconbtn:disabled{opacity:.4;cursor:default}
.modes{display:grid;gap:10px}
.mode{border:0;border-radius:22px;padding:10px 16px;display:flex;align-items:center;gap:14px;text-align:left;color:#fff;box-shadow:var(--shadow);background:var(--g)}
.mode .em{font-size:32px;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.mode h3{font-size:1.5rem}.mode p{opacity:.95;font-size:.92rem}
.regions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.region{border:0;border-radius:22px;padding:14px;text-align:left;display:grid;gap:6px;background:var(--card);box-shadow:var(--shadow);border-bottom:6px solid var(--c)}
.region .ic{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--c) 22%,transparent);display:grid;place-items:center;font-size:24px}
.region small{color:var(--muted)}
.region .fl{font-size:1.2rem;letter-spacing:2px}
.region.wide{grid-column:1/-1;grid-template-columns:auto 1fr;align-items:center;column-gap:12px}
.prog{display:grid;gap:8px}
.progrow{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-size:1.05rem;font-variant-numeric:tabular-nums}
.chip{background:var(--card);border-radius:99px;padding:4px 12px;box-shadow:var(--shadow)}
.track{height:14px;border-radius:99px;background:var(--card);box-shadow:inset 0 2px 4px rgba(0,0,0,.08);overflow:hidden;padding:3px}
.track i{display:block;height:100%;border-radius:99px;background:var(--g);transition:width .35s}
.qcard{padding:24px 18px;display:grid;justify-items:center;gap:12px;text-align:center;position:relative}
.qcard .tag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--g);color:#fff;border-radius:99px;padding:3px 14px;font-size:.8rem;white-space:nowrap}
.bigflag{font-size:min(120px,30vw);line-height:1.05;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.midflag{font-size:58px;line-height:1}
.qtext{font-family:var(--display);font-size:1.5rem;font-weight:800}
.qtext.sm{font-size:1.25rem}
.code{font:800 .85rem ui-monospace,Menlo,monospace;background:var(--soft);padding:4px 12px;border-radius:99px}
.mascotrow{display:flex;align-items:center;gap:10px}
.answers{display:grid;gap:12px}
.ans{border:3px solid transparent;border-radius:20px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;
  min-height:62px;padding:10px 14px;text-align:left;font-size:1.08rem;transition:transform .2s,opacity .2s,background .2s}
.ans .b{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.2rem;background:var(--c)}
.ans.good{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--card));animation:pop .4s}
.ans.good .b{background:var(--green)}
.ans.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--card));animation:shake .45s}
.ans.bad .b{background:var(--red)}
.ans.dim{opacity:.5}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fopt{position:relative;border:3px solid transparent;border-radius:22px;background:var(--card);box-shadow:var(--shadow);padding:16px 8px 12px;min-height:132px;display:grid;justify-items:center;align-content:center;gap:6px;transition:transform .2s,opacity .2s}
.fopt .fl{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:66px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.15))}
.fopt .lt{position:absolute;top:8px;left:8px;width:28px;height:28px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--display)}
.fopt .nm{font-size:.9rem;text-align:center}
.fopt.good{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--card));animation:pop .4s}
.fopt.bad{border-color:var(--red);background:color-mix(in srgb,var(--red) 14%,var(--card));animation:shake .45s}
.fopt.dim{opacity:.5}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.big{border:0;border-radius:20px;padding:16px;width:100%;font-family:var(--display);font-size:1.25rem;font-weight:800;color:#fff;background:var(--g,var(--blue));box-shadow:0 5px 0 rgba(0,0,0,.18)}
.countdown{position:relative;overflow:hidden}
.countdown::after{content:"";position:absolute;left:0;bottom:0;height:6px;width:100%;background:rgba(255,255,255,.55);transform-origin:left;animation:countdown var(--wait,5s) linear forwards}
@keyframes countdown{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.big.alt{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.results{padding:22px 18px;display:grid;justify-items:center;gap:16px;text-align:center}
.stars{display:flex;gap:6px;font-size:52px;line-height:1}
.stars span{filter:grayscale(1) opacity(.35)}.stars span.on{filter:none;animation:pop .5s backwards}
.stars span.on:nth-child(2){animation-delay:.15s}.stars span.on:nth-child(3){animation-delay:.3s}
.score{font-family:var(--display);font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tile{border-radius:18px;padding:12px;display:grid;gap:2px}
.tile b{font-family:var(--display);font-size:1.6rem}
.review{width:100%;display:grid;gap:8px;text-align:left}
.rv{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:8px 12px}
.rv .f{font-size:28px}.rv div{display:grid;min-width:0}.rv span{color:var(--muted);font-size:.9rem}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seg button,.opt{border:3px solid transparent;border-radius:16px;background:var(--card);box-shadow:var(--shadow);padding:10px 6px;display:grid;justify-items:center;gap:2px;font-size:.92rem}
.seg button .e{font-size:26px}
.seg button[aria-pressed="true"],.opt[aria-pressed="true"]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--card))}
.field{display:grid;gap:8px}
.field>label,.lbl{font-family:var(--display);font-size:1.05rem}
.players{display:grid;gap:10px}
.prow{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.av{border:0;flex:none;width:48px;height:48px;border-radius:14px;font-size:30px;display:grid;place-items:center;background:var(--c)}
.prow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px;font:800 1rem var(--body);color:var(--ink);background:var(--soft)}
.rm{border:0;background:none;font-size:20px;width:36px;height:36px;color:var(--muted)}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{padding:8px 14px}
select{border:2px solid var(--line);border-radius:14px;padding:12px;font:800 1rem var(--body);color:var(--ink);background:var(--card);width:100%}
.board{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pl{flex:1;min-width:76px;border-radius:18px;padding:8px;display:grid;justify-items:center;background:var(--card);box-shadow:var(--shadow);border:3px solid transparent;transition:transform .2s}
.pl.now{border-color:var(--c);transform:translateY(-3px)}
.pl .a{font-size:28px}.pl small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.pl b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.handoff{padding:30px 20px;display:grid;justify-items:center;gap:14px;text-align:center}
.handoff .huge{font-size:96px;line-height:1;animation:pop .6s}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%}
.step{flex:1;max-width:120px;display:grid;justify-items:center;gap:4px}
.step .a{font-size:40px}
.step .blk{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:1.6rem;font-weight:800}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:0 14px}
.search input{flex:1;min-width:0;border:0;background:none;padding:14px 0;font:800 1rem var(--body);color:var(--ink)}
.search input:focus{outline:none}.search:focus-within{outline:3px solid var(--blue)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px}
.chips button{flex:none;border:0;border-radius:99px;padding:8px 14px;background:var(--card);box-shadow:var(--shadow);font-size:.9rem}
.chips button[aria-pressed="true"]{background:var(--c,var(--blue));color:#fff}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.lc{border:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:12px 6px;display:grid;justify-items:center;gap:4px;font-size:.85rem;text-align:center;border-top:5px solid var(--c)}
.lc .f{font-size:44px;line-height:1}
.empty{text-align:center;color:var(--muted);padding:24px}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(15,20,45,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.sheet .box{width:100%;max-width:500px;max-height:90%;overflow:auto;padding:22px 18px;display:grid;gap:14px;animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.detail{display:grid;justify-items:center;gap:8px;text-align:center}
.detail .f{font-size:110px;line-height:1}
.facts{display:grid;gap:10px;width:100%}
.fact{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px;background:color-mix(in srgb,var(--c) 14%,var(--card));text-align:left}
.fact .i{width:44px;height:44px;flex:none;border-radius:14px;background:var(--c);display:grid;place-items:center;font-size:22px}
.fact small{display:block;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em}
.fact b{font-family:var(--display);font-size:1.2rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mapwrap{position:relative;width:100%}
.map{display:block;width:100%;height:auto;aspect-ratio:5/3;border-radius:20px;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--ink) 8%,transparent)}
.mapbtn{position:absolute;right:10px;bottom:10px;border:0;border-radius:99px;padding:7px 12px;background:var(--card);box-shadow:var(--shadow);font-size:.85rem}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.6);opacity:.1}}
.mode{position:relative}
.mbadge{position:absolute;top:8px;right:10px;background:rgba(255,255,255,.92);color:#1f2a4d;font-family:var(--body);font-size:.72rem;font-weight:800;border-radius:99px;padding:3px 9px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.mbadge.locked{background:#1f2a4d;color:#fff}
.freechip{border:0;align-self:flex-start;border-radius:99px;padding:8px 14px;background:var(--card);box-shadow:var(--shadow);font-size:.9rem}
.freechip.low{background:color-mix(in srgb,var(--orange) 22%,var(--card))}
.perks{display:grid;gap:8px;text-align:left;width:100%}
.perks div{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px}
.price{font-family:var(--display);font-size:2rem;font-weight:800}
.gate input{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font:800 1.3rem var(--body);text-align:center;color:var(--ink);background:var(--soft)}
.err{color:var(--red)}
.demo{font-size:.8rem;color:var(--muted)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{display:flex;gap:6px;max-width:520px;width:100%;background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:6px}
.tab{flex:1;border:0;background:none;border-radius:20px;padding:6px 4px;display:grid;justify-items:center;font-size:.8rem;color:var(--muted)}
.tab .e{font-size:24px;line-height:1.2}
.tab[aria-selected="true"]{background:var(--c);color:#fff}
.mascot{flex:none;display:block;overflow:visible}
.brand{display:flex;align-items:center;gap:12px;align-self:stretch}
.logo{display:block;width:92px;height:92px;flex:none;filter:drop-shadow(0 4px 8px rgba(20,60,120,.25))}
.brand .eyebrow{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1.05;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);
  background:linear-gradient(90deg,var(--orange),var(--pink) 55%,var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand .bname{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
#splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:linear-gradient(var(--sky1),var(--sky2)) var(--sky1);transition:opacity .45s;cursor:pointer}
#splash img{width:min(78vw,380px);height:auto;filter:drop-shadow(0 18px 30px rgba(20,60,120,.3));animation:pop .7s}
#splash.gone{opacity:0;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.confirm{padding:20px;display:grid;gap:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* iPad and other large screens: scale the whole app up instead of leaving a narrow column */
@media (min-width:740px) and (min-height:900px){.app,.tabbar .in,.sheet .box{zoom:1.45}.sheet .box{max-height:58vh}.sheet{align-items:center}}
@media (min-width:1100px) and (min-height:900px) and (max-height:1100px){.app,.tabbar .in,.sheet .box{zoom:1.25}.sheet .box{max-height:68vh}.sheet{align-items:center}}
/* Windows has no flag emoji, so flags use the Noto Color Emoji web font everywhere */
.bigflag,.midflag,.region .fl,.rv .f,.lc .f,.detail .f,.fact b,.flagtxt{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif}
.fact b{font-family:var(--display)}.fact b .flagtxt{font-family:"Noto Color Emoji",sans-serif}
</style>

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ansOf=(c,t)=>t==='flag'||t==='flagpick'?c.name:t==='capital'?c.capital:c.currency;
const pool=cont=>cont&&cont!=='all'?ALL.filter(c=>c.cont===cont):ALL;
function makeRound(type,cont,count){
  const p=pool(cont);let picks=[];while(picks.length<count)picks=picks.concat(shuf(p));
  return picks.slice(0,count).map(c=>{const right=ansOf(c,type),d=[];
    for(const x of [...shuf(ALL.filter(y=>y.cont===c.cont)),...shuf(ALL)]){const a=ansOf(x,type);if(a!==right&&!d.includes(a))d.push(a);if(d.length===3)break}
    const prompt=type==='flagpick'?`Which flag belongs to ${c.name}?`:type==='flag'?'Which country has this flag?':type==='capital'?`What is the capital of ${c.name}?`:`What is the currency of ${c.name}?`;
    return{c,type,prompt,options:shuf([right,...d]),right}});
}

// Made with the Web Audio API, so there are no sound files. Right: chime + two puppy yips.
// Wrong: cartoon boing + a little puppy whimper.
let SOUND=true;try{SOUND=localStorage.getItem('geo.sound')!=='off'}catch(e){}
let AC=null,OUT=null;
function audio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();OUT=AC.createGain();OUT.gain.value=.8;OUT.connect(AC.destination)}
  if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function env(ctx,t,peak,len,att=.01){const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+len);g.connect(OUT);return g}
function noise(ctx,len){const b=ctx.createBuffer(1,Math.ceil(ctx.sampleRate*len),ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const n=ctx.createBufferSource();n.buffer=b;return n}
function tone(ctx,t,f,len,vol,type){const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);o.connect(env(ctx,t,vol,len));o.start(t);o.stop(t+len+.05)}
function yip(ctx,t,base,len,vol){ // a small dog's bark: quick rising-then-falling pitch, filtered, with breath
  const o=ctx.createOscillator(),f=ctx.createBiquadFilter();o.type='sawtooth';
  o.frequency.setValueAtTime(base*.75,t);o.frequency.exponentialRampToValueAtTime(base*1.45,t+len*.28);o.frequency.exponentialRampToValueAtTime(base*.85,t+len);
  f.type='bandpass';f.frequency.value=base*2.4;f.Q.value=1.4;o.connect(f);f.connect(env(ctx,t,vol,len,.008));o.start(t);o.stop(t+len+.05);
  const n=noise(ctx,len),nf=ctx.createBiquadFilter();nf.type='bandpass';nf.frequency.value=base*3.2;nf.Q.value=.9;n.connect(nf);nf.connect(env(ctx,t,vol*.3,len*.7,.005));n.start(t);n.stop(t+len)}
function boing(ctx,t){const o=ctx.createOscillator(),lfo=ctx.createOscillator(),depth=ctx.createGain();o.type='sine';
  o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(95,t+.55);
  lfo.frequency.value=17;depth.gain.setValueAtTime(70,t);depth.gain.exponentialRampToValueAtTime(1,t+.55);lfo.connect(depth);depth.connect(o.frequency);
  o.connect(env(ctx,t,.55,.6,.006));o.start(t);lfo.start(t);o.stop(t+.65);lfo.stop(t+.65)}
function whimper(ctx,t){const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),v=ctx.createOscillator(),vd=ctx.createGain();o.type='sawtooth';
  o.frequency.setValueAtTime(820,t);o.frequency.linearRampToValueAtTime(900,t+.08);o.frequency.exponentialRampToValueAtTime(520,t+.38);
  v.frequency.value=9;vd.gain.value=18;v.connect(vd);vd.connect(o.frequency);f.type='bandpass';f.frequency.value=1500;f.Q.value=2;
  o.connect(f);f.connect(env(ctx,t,.22,.4,.03));o.start(t);v.start(t);o.stop(t+.45);v.stop(t+.45)}
function sfx(kind){if(!SOUND)return;const ctx=audio();if(!ctx)return;const t=ctx.currentTime+.02;
  if(kind==='right'){[1047,1319,1568,2093].forEach((f,i)=>tone(ctx,t+i*.065,f,.25,.16,'triangle'));yip(ctx,t+.22,560,.12,.6);yip(ctx,t+.38,640,.14,.6)}
  else{boing(ctx,t);whimper(ctx,t+.5)}}
function click(){if(!SOUND)return;const ctx=audio();if(!ctx)return;const t=ctx.currentTime+.005;
  const o=ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(1500,t+.06);o.connect(env(ctx,t,.35,.09,.003));o.start(t);o.stop(t+.12);
  const n=noise(ctx,.03),f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=3000;n.connect(f);f.connect(env(ctx,t,.18,.03,.002));n.start(t);n.stop(t+.03)}
function swish(){if(!SOUND)return;const ctx=audio();if(!ctx)return;const t=ctx.currentTime+.005,len=.32;
  const n=noise(ctx,len),f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=1.6;f.frequency.setValueAtTime(350,t);f.frequency.exponentialRampToValueAtTime(3800,t+len*.85);
  n.connect(f);f.connect(env(ctx,t,.5,len,.09));n.start(t);n.stop(t+len)}

const cv=document.getElementById('confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function stopConfetti(){cancelAnimationFrame(raf);parts=[];try{cx.clearRect(0,0,cv.width,cv.height)}catch(e){}}
function confetti(){if(reduce)return;cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#ff5d8f','#2f8cff','#ffc928','#2fc46b','#8f5bff','#ff9a1f','#18c4c4'];
  parts=Array.from({length:140},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,r:Math.random()*6,s:6+Math.random()*7,c:cols[Math.random()*cols.length|0],w:Math.random()*.2}));
  cancelAnimationFrame(raf);const t0=performance.now();
  (function tick(t){cx.clearRect(0,0,cv.width,cv.height);let alive=false;
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.r+=p.w;if(p.y<cv.height+20)alive=true;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
    if(alive&&t-t0<6000)raf=requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)})(t0);
}

const MAPNAME={'DR Congo':'Democratic Republic of the Congo','Eswatini':'Swaziland','Guinea-Bissau':'Guinea Bissau','North Macedonia':'Macedonia','Serbia':'Republic of Serbia','Timor-Leste':'East Timor','Tanzania':'United Republic of Tanzania','Czechia':'Czech Republic','United States':'United States of America','Bahamas':'The Bahamas'};
const PINS={Singapore:[103.82,1.35],Barbados:[-59.55,13.19],'Saint Lucia':[-60.98,13.91],Samoa:[-172.1,-13.76],Tonga:[-175.2,-21.18],Kiribati:[173,1.42],Tuvalu:[179.19,-8.52],Nauru:[166.93,-0.52],'Marshall Islands':[171.18,7.13],Palau:[134.58,7.51],Micronesia:[158.22,6.92],'Cape Verde':[-23.6,15.1],Comoros:[43.87,-11.88],Mauritius:[57.55,-20.35],'São Tomé and Príncipe':[6.61,0.19],Seychelles:[55.45,-4.62],Bahrain:[50.55,26.07],Maldives:[73.51,4.17],Andorra:[1.52,42.51],Liechtenstein:[9.52,47.14],Malta:[14.51,35.9],Monaco:[7.42,43.74],'San Marino':[12.45,43.94],'Vatican City':[12.45,41.9],'Antigua and Barbuda':[-61.8,17.07],Dominica:[-61.37,15.41],Grenada:[-61.68,12.12],'Saint Kitts and Nevis':[-62.78,17.3],'Saint Vincent and the Grenadines':[-61.2,13.25]};
const PJ=(lon,lat)=>[(lon+180)*3,(84-lat)*3];
let MAP=null,LAND='';
function buildMap(){if(MAP)return MAP;const{transform:{scale:[sx,sy],translate:[tx,ty]},arcs,geoms}=WORLD;
  const dec=arcs.map(a=>{let x=0,y=0;return a.map(([dx,dy])=>{x+=dx;y+=dy;return PJ(x*sx+tx,y*sy+ty)})});
  const ring=r=>{let pts=[];r.forEach(i=>{const a=i<0?dec[~i].slice().reverse():dec[i];pts=pts.concat(pts.length?a.slice(1):a)});return pts};
  MAP={};
  for(const g of geoms){if(!g.a)continue;const polys=g.t==='Polygon'?[g.a]:g.a;let d='',best=null,ba=-1;
    polys.forEach(p=>p.forEach((r,ri)=>{const pts=ring(r);d+='M'+pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L')+'Z';
      if(ri===0){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of pts){if(x<x0)x0=x;if(y<y0)y0=y;if(x>x1)x1=x;if(y>y1)y1=y}
        const ar=(x1-x0)*(y1-y0);if(ar>ba){ba=ar;best=[x0,y0,x1,y1]}}}));
    MAP[g.n]={d,box:best}}
  LAND=Object.values(MAP).map(o=>`<path d="${o.d}"/>`).join('');return MAP}
function mapSVG(c,world){const M=buildMap(),key=MAPNAME[c.name]||c.name,m=M[key];let box,pin;
  if(m){box=m.box;pin=[(box[0]+box[2])/2,(box[1]+box[3])/2]}else if(PINS[c.name]){pin=PJ(...PINS[c.name]);box=[pin[0]-4,pin[1]-4,pin[0]+4,pin[1]+4]}else return '';
  let vb;
  if(world)vb=[0,0,1080,648*1080/1080*0.6667];
  else{const cx=(box[0]+box[2])/2,cy=(box[1]+box[3])/2;let w=Math.max((box[2]-box[0])*2,110),h=Math.max((box[3]-box[1])*2,w*.6);w=Math.max(w,h/.6);h=w*.6;vb=[cx-w/2,cy-h/2,w,h]}
  if(world){vb=[0,-24,1080,648]}
  const r=vb[2]/70;
  return `<svg class="map" viewBox="${vb.map(n=>n.toFixed(1)).join(' ')}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map showing where ${esc(c.name)} is">
   <rect x="-2000" y="-2000" width="5000" height="5000" fill="var(--ocean)"/>
   <g fill="var(--land)" stroke="var(--landline)" stroke-width="${(r/5).toFixed(2)}" stroke-linejoin="round">${LAND}</g>
   ${m?`<path d="${m.d}" fill="var(--pink)" stroke="#fff" stroke-width="${(r/3).toFixed(2)}" stroke-linejoin="round"/>`:''}
   <circle class="pulse" cx="${pin[0]}" cy="${pin[1]}" r="${r*1.4}" fill="var(--pink)" opacity=".35"/>
   <circle cx="${pin[0]}" cy="${pin[1]}" r="${r*.6}" fill="var(--pink)" stroke="#fff" stroke-width="${(r/4).toFixed(2)}"/></svg>`}

const KNAME={flag:'Flags',flagpick:'Find the Flag',capital:'Capitals',currency:'Currency',challenge:'Challenge'};
let plan={usedBy:{},plus:false};
try{const p=JSON.parse(localStorage.getItem('globie.plan'));if(p)plan=Object.assign(plan,p)}catch(e){}
if(!plan.usedBy||typeof plan.usedBy!=='object')plan.usedBy={};delete plan.used;
// In the iPhone app, window.NATIVE is injected before this script runs. The app keeps the
// free-quiz count in the Keychain (it survives deleting and reinstalling the app) and owns
// the Explorer Pass purchase through StoreKit, so the web page cannot unlock it by itself.
const NATIVE=window.NATIVE||null;
const post=m=>{try{window.webkit.messageHandlers.native.postMessage(m)}catch(e){}};
let PRICE='£2.99';
const mergeUsed=src=>{if(src)KINDS.forEach(k=>{plan.usedBy[k]=Math.max(plan.usedBy[k]|0,src[k]|0)})};
if(NATIVE){mergeUsed(NATIVE.usedBy);plan.plus=!!NATIVE.plus;if(NATIVE.price)PRICE=NATIVE.price}
const savePlan=()=>{try{localStorage.setItem('globie.plan',JSON.stringify(plan))}catch(e){}if(NATIVE)post({type:'used',usedBy:plan.usedBy})};
const PAYMSG={cancelled:'Purchase cancelled. Nothing was charged.',pending:'Waiting for approval. If Ask to Buy is on, a parent needs to approve it.',
  failed:'Something went wrong with the purchase. Please try again.',unavailable:'The App Store isn’t available right now. Check the internet connection and try again.',
  none:'No Explorer Pass found for this Apple Account.'};
window.nativeUpdate=u=>{
  mergeUsed(u.usedBy);
  if(u.plus!=null)plan.plus=!!u.plus;
  if(u.price)PRICE=u.price;
  try{localStorage.setItem('globie.plan',JSON.stringify(plan))}catch(e){}
  if(u.status&&S.pay){if(u.status==='purchased'||u.status==='restored'){S.pay={step:'done',restored:u.status==='restored'};confetti()}else S.pay={step:'offer',msg:PAYMSG[u.status]||PAYMSG.failed}}
  render()};
const usedOf=k=>plan.usedBy[k]|0;
const freeLeft=k=>Math.max(0,FREE-usedOf(k));
function useQuiz(k){if(plan.plus)return true;if(usedOf(k)>=FREE){S.pay={step:'offer',kind:k};return false}plan.usedBy[k]=usedOf(k)+1;savePlan();return true}
function freeChip(k){if(plan.plus)return `<button class="freechip press" data-act="pay-open">⭐ Explorer Pass unlocked</button>`;
  const l=freeLeft(k);return `<button class="freechip press ${l<=2?'low':''}" data-act="pay-open" data-kind="${k}">${l?`🎟️ ${l} of ${FREE} free ${KNAME[k]} games left`:`🔒 Free ${KNAME[k]} games used · Unlock all`}</button>`}
function modeBadge(k){if(plan.plus)return '';const l=freeLeft(k);return `<span class="mbadge ${l?'':'locked'}">${l?`🎟️ ${l} free left`:'🔒 Unlock'}</span>`}
function paySheet(){const p=S.pay;let body='';
  if(p.step==='offer')body=`${mascot(84,'cheer',false)}<h2>${p.kind&&!freeLeft(p.kind)?`You’ve played all ${FREE} free ${KNAME[p.kind]} games!`:'Unlock the Explorer Pass'}</h2>
   <p style="color:var(--muted)">Great exploring! Unlock unlimited quizzes for the whole family.</p>
   <div class="perks"><div>🎮 Unlimited Flags, Find the Flag, Capitals and Currency</div><div>🏆 Unlimited Challenge games with friends</div><div>🚫 No ads, ever</div><div>📚 Learn stays free for everyone</div></div>
   <p class="price">${esc(PRICE)} <span style="font-size:1rem;color:var(--muted)">one-time</span></p>
   <button class="big press" style="--g:linear-gradient(135deg,var(--pink),var(--orange))" data-act="pay-gate">Ask a grown-up to unlock 👪</button>
   <button class="big alt press" data-act="pay-restore">Restore purchase</button>${p.msg?`<p class="demo">${p.msg}</p>`:''}
   <button class="big alt press" data-act="pay-close">Maybe later</button>`;
  else if(p.step==='gate')body=`<h2>Grown-ups only 🔒</h2><p style="color:var(--muted)">To continue, please answer:</p>
   <p class="price">${p.a} × ${p.b} = ?</p><div class="gate"><label class="sr" for="gate">Answer</label><input id="gate" inputmode="numeric" autocomplete="off"></div>
   ${p.err?`<p class="err">That’s not right. Please try again.</p>`:''}
   <button class="big press" data-act="pay-check">Continue</button><button class="big alt press" data-act="pay-close">Cancel</button>`;
  else if(p.step==='wait')body=`${mascot(84,'happy',false)}<h2>${p.restore?'Checking your purchases…':'Opening the App Store…'}</h2>
   <p style="color:var(--muted)">This only takes a moment.</p>`;
  else if(p.step==='buy')body=`<h2>Buy the Explorer Pass</h2><p class="price">${esc(PRICE)}</p>
   <p class="demo">Demo build: no payment is taken. In the store version this button opens the App Store or Google Play payment sheet.</p>
   <button class="big press" style="--g:linear-gradient(135deg,var(--green),var(--teal))" data-act="pay-buy">Unlock (demo)</button><button class="big alt press" data-act="pay-close">Cancel</button>`;
  else if(p.step==='done')body=`${mascot(90,'cheer',false)}<h2>${p.restored?'Welcome back! 🎉':'Unlocked! 🎉'}</h2><p>${p.restored?'Your Explorer Pass is restored. ':''}Enjoy unlimited quizzes.</p><button class="big press" data-act="pay-close">Let’s play!</button>`;
  else if(p.step==='plus')body=`${mascot(84,'cheer',false)}<h2>Explorer Pass is on ⭐</h2><p style="color:var(--muted)">Unlimited quizzes are unlocked${NATIVE?' for this Apple Account':' on this device'}.</p>
   <button class="big press" data-act="pay-close">Close</button>${NATIVE?'':`<button class="big alt press" data-act="pay-reset">Remove demo unlock (for testing)</button>`}`;
  return `<div class="sheet" data-act="pay-bg"><div class="card box confirm" role="dialog" aria-modal="true" aria-label="Explorer Pass">${body}</div></div>`}

// ---------- Render ----------
const TABS=[['learn','📚','Learn','--purple'],['play','🎮','Play','--blue'],['challenge','🏆','Challenge','--pink']];
function render(){
  const m=document.getElementById('main');let h='';
  if(S.tab==='play')h=S.play.view==='home'?playHome():S.play.view==='regions'?regionPicker(S.play.type,'home'):playQuiz();
  else if(S.tab==='challenge'){const p=S.ch.phase;h=p==='setup'?chSetup():p==='handoff'?chHandoff():p==='q'?chQuestion():chDone()}
  else h=learnView();
  m.innerHTML=h;
  document.getElementById('tabs').innerHTML=TABS.map(([k,e,l,c])=>`<button class="tab press" role="tab" aria-selected="${S.tab===k}" style="--c:var(${c})" data-act="tab" data-tab="${k}"><span class="e" aria-hidden="true">${e}</span>${l}</button>`).join('');
  let o='';
  if(S.tab==='learn'&&S.learn.open)o=detailSheet();
  if(S.confirm)o=`<div class="sheet" data-act="cancel-bg"><div class="card box confirm" role="dialog" aria-modal="true" aria-label="Reset stats">${mascot(70,'oops',false)}<h2>Reset all your stars?</h2><p style="color:var(--muted)">This clears your right answers, oops answers and games played.</p>
    <button class="big press" style="--g:var(--red)" data-act="do-reset">Yes, start fresh</button><button class="big alt press" data-act="cancel">Keep my stars</button></div></div>`;
  if(S.pay)o=paySheet();
  document.getElementById('overlay').innerHTML=o;
  const g=document.getElementById('gate');if(g)g.focus();
}
const top0=()=>window.scrollTo({top:0});

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if((a==='close-bg'||a==='cancel-bg'||a==='pay-bg')&&e.target!==el)return;
  const P=S.play,C=S.ch,L=S.learn;
  switch(a){
   case'tab':if(S.tab!==el.dataset.tab){swish();stopConfetti();S.tab=el.dataset.tab;top0()}break;
   case'sound':SOUND=!SOUND;try{localStorage.setItem('geo.sound',SOUND?'on':'off')}catch(e){}if(SOUND)sfx('right');break;
   case'mode':click();P.type=el.dataset.type;P.view='regions';top0();break;
   case'home':clearT();P.view='home';top0();break;
   case'region':click();P.cont=el.dataset.cont;if(useQuiz(P.type)){startPlay();top0()}break;
   case'quit':clearT();P.view='regions';break;
   case'answer':if(S.tab==='play')playAnswer(+el.dataset.k);else chAnswer(+el.dataset.k);return;
   case'next':playNext();top0();return;
   case'again':if(useQuiz(P.type)){startPlay();top0()}break;
   case'ask-reset':S.confirm=true;break;
   case'cancel':case'cancel-bg':S.confirm=false;break;
   case'do-reset':stats={correct:0,oops:0,rounds:0,best:0};saveStats();S.confirm=false;break;
   case'avatar':{const p=C.players[+el.dataset.i];const used=C.players.map(x=>x.av);let k=AVATARS.indexOf(p.av);do{k=(k+1)%AVATARS.length}while(used.includes(AVATARS[k])&&AVATARS[k]!==p.av);p.av=AVATARS[k];break}
   case'addp':if(C.players.length<4){const free=AVATARS.find(x=>!C.players.some(p=>p.av===x));C.players.push({name:`Player ${C.players.length+1}`,av:free,score:0})}break;
   case'rm':C.players.splice(+el.dataset.i,1);break;
   case'ctype':C.type=el.dataset.type;break;
   case'each':C.each=+el.dataset.n;break;
   case'cstart':if(useQuiz('challenge')){chStart();top0()}break;
   case'ready':C.phase='q';top0();break;
   case'cnext':chNext();top0();return;
   case'cquit':clearT();C.phase='setup';break;
   case'rematch':if(useQuiz('challenge')){chStart();top0()}break;
   case'mapzoom':L.world=!L.world;break;
   case'pay-open':S.pay={step:plan.plus?'plus':'offer',kind:el.dataset.kind};break;
   case'pay-bg':case'pay-close':if(S.pay&&S.pay.step==='wait')return;S.pay=null;break;
   case'pay-gate':S.pay={step:'gate',a:6+(Math.random()*4|0),b:6+(Math.random()*4|0)};break;
   case'pay-check':{const val=+document.getElementById('gate').value;if(val!==S.pay.a*S.pay.b){S.pay.err=true;break}
     if(NATIVE){S.pay={step:'wait'};post({type:'buy'})}else S.pay={step:'buy'};break}
   case'pay-buy':plan.plus=true;savePlan();S.pay={step:'done'};confetti();break;
   case'pay-restore':if(NATIVE){S.pay={step:'wait',restore:true};post({type:'restore'})}else S.pay.msg=plan.plus?'Restored!':'No purchase found on this device. (Demo build)';break;
   case'pay-reset':if(NATIVE)break;plan={usedBy:{},plus:false};savePlan();S.pay=null;break;
   case'cnew':C.phase='setup';top0();break;
   case'lcont':L.cont=el.dataset.cont;break;
   case'open':L.open=el.dataset.name;break;
   case'surprise':{const l=learnFiltered();if(l.length)L.open=l[Math.random()*l.length|0].name;break}
   case'prev':case'nextc':{const l=learnFiltered(),i=l.findIndex(c=>c.name===L.open);L.open=l[(i+(a==='prev'?-1:1)+l.length)%l.length].name;break}
   case'close':case'close-bg':L.open=null;break;
  }
  render();
});
document.addEventListener('input',e=>{
  if(e.target.classList.contains('pname'))S.ch.players[+e.target.dataset.i].name=e.target.value;
  if(e.target.id==='lsearch'){S.learn.q=e.target.value;document.getElementById('lgrid').innerHTML=learnGrid()}
  if(e.target.id==='creg')S.ch.cont=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.id==='creg')S.ch.cont=e.target.value});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='gate'){document.querySelector('[data-act="pay-check"]').click();return}if(e.key==='Escape'&&(S.learn.open||S.confirm||S.pay)){if(S.pay){if(S.pay.step==='wait')return;S.pay=null}else{S.learn.open=null;S.confirm=false}render()}});
(()=>{try{const c=document.createElement('canvas');c.width=c.height=20;const x=c.getContext('2d');x.textBaseline='top';x.font='16px sans-serif';x.fillText('\u{1F1EC}\u{1F1E7}',0,0);
  const d=x.getImageData(0,0,20,20).data;let colour=false;for(let i=0;i<d.length;i+=4){if(d[i+3]&&(Math.abs(d[i]-d[i+1])>30||Math.abs(d[i+1]-d[i+2])>30)){colour=true;break}}
  if(!colour){const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap';document.head.appendChild(l)}}catch(e){}})();
// Block pinch-zoom (Safari gesture events and two-finger moves). Double-tap zoom is off via touch-action.
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
(()=>{const sp=document.getElementById('splash');const hide=()=>{sp.classList.add('gone');setTimeout(()=>sp.remove(),500)};sp.onclick=hide;setTimeout(hide,1600)})();
</script>

</body>
</html>
